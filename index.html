<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Blossom Events ERP</title>
<link rel="manifest" id="manifestLink">
<meta name="theme-color" content="#11204B">
<style>
:root{
  --plum:#11204B; --plum-2:#2D4B8F; --gold:#F3B438; --gold-2:#F8D87B;
  --blush:#F6705E; --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EDF1F8;
  --ink:#131A34; --ink-soft:#5B6B8F; --line:rgba(19,26,52,0.08);
  --ok:#2A8C80; --warn:#E77B3D; --danger:#C13D57;
  --radius:18px; --radius-sm:12px;
  --shadow:0 8px 30px rgba(17,32,75,0.12);
  --font-display:'Fraunces',serif; --font-body:'Manrope',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --plum:#0F1B3E; --plum-2:#3D4E9E; --gold:#F3B438; --gold-2:#F8D87B;
  --blush:#F98A6D; --bg:#0C1123; --surface:#161F3E; --surface-2:#232D57;
  --ink:#F5F7FF; --ink-soft:#B0BEDC; --line:rgba(245,247,255,0.08);
  --shadow:0 8px 30px rgba(0,0,0,0.45);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
body{overscroll-behavior-y:none;}
h1,h2,h3,.serif{font-family:var(--font-display);}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}

#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);backdrop-filter:blur(6px);padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--plum),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;flex-shrink:0;overflow:hidden;}
.brand-logo img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:var(--ink-soft);margin-top:-2px;}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.icon-btn:active{transform:scale(0.94);}

/* View header */
.view-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin:6px 16px 2px;}
.view-sub{font-size:12.5px;color:var(--ink-soft);margin:0 16px 14px;}

main{flex:1;padding:0 16px 100px;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
.glass{background:linear-gradient(135deg,rgba(255,255,255,0.55),rgba(255,255,255,0.25));backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.4);}
[data-theme="dark"] .glass{background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.08);}

/* Hero arch (signature element) */
.hero-arch{position:relative;border-radius:32px;background:linear-gradient(160deg,var(--plum) 0%,var(--plum-2) 55%,var(--gold) 130%);color:#fff;padding:22px 20px 26px;overflow:hidden;box-shadow:var(--shadow);}
.hero-arch::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.18),transparent 70%);}
.hero-eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.85;}
.hero-figure{font-family:var(--font-display);font-size:34px;font-weight:600;margin:4px 0 2px;}
.hero-label{font-size:12.5px;opacity:0.9;}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.hero-stat{background:rgba(255,255,255,0.14);border-radius:14px;padding:10px 12px;}
.hero-stat .v{font-family:var(--font-mono);font-size:16px;font-weight:600;}
.hero-stat .l{font-size:10.5px;opacity:0.85;margin-top:2px;}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;}
.stat-card .v{font-family:var(--font-mono);font-size:19px;font-weight:700;}
.stat-card .l{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.stat-card.ok .v{color:var(--ok);} .stat-card.warn .v{color:var(--warn);} .stat-card.danger .v{color:var(--danger);}

.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);margin:18px 2px 8px;display:flex;align-items:center;justify-content:space-between;}
.section-label a{color:var(--plum);text-decoration:none;font-weight:600;text-transform:none;letter-spacing:0;font-size:12.5px;}
[data-theme="dark"] .section-label a{color:var(--gold-2);}

/* Health bar */
.health-bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:8px;}
.health-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--plum));}

/* List rows */
.list-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;cursor:pointer;}
.list-row:active{transform:scale(0.99);}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;color:var(--plum);flex-shrink:0;overflow:hidden;font-size:15px;}
[data-theme="dark"] .avatar{color:var(--gold-2);}
.avatar img{width:100%;height:100%;object-fit:cover;}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-end{text-align:right;flex-shrink:0;}
.row-amt{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:3px;letter-spacing:.3px;}
.chip.ok{background:rgba(62,142,90,0.15);color:var(--ok);}
.chip.warn{background:rgba(199,123,43,0.15);color:var(--warn);}
.chip.danger{background:rgba(180,68,59,0.15);color:var(--danger);}
.chip.neutral{background:var(--surface-2);color:var(--ink-soft);}
.chip.plum{background:rgba(74,25,66,0.12);color:var(--plum);}
[data-theme="dark"] .chip.plum{background:rgba(228,197,137,0.15);color:var(--gold-2);}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--ink-soft);}
.empty-icon{font-size:38px;margin-bottom:10px;}
.empty-title{font-family:var(--font-display);font-size:17px;color:var(--ink);margin-bottom:4px;}
.empty-sub{font-size:13px;margin-bottom:16px;}

/* Buttons */
.btn{border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--plum),var(--plum-2));color:#fff;}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#2B2320;}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-danger{background:rgba(180,68,59,0.12);color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}

/* FAB */
.fab{position:fixed;right:calc(50% - 260px + 20px);bottom:96px;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--plum),var(--gold));color:#fff;border:none;font-size:26px;box-shadow:0 10px 24px rgba(74,25,66,0.35);z-index:30;display:flex;align-items:center;justify-content:center;cursor:pointer;}
@media (max-width:560px){.fab{right:20px;}}
.fab:active{transform:scale(0.92);}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:25;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;color:var(--ink-soft);cursor:pointer;border:none;background:none;font-family:inherit;}
.nav-item.active{color:var(--plum);}
[data-theme="dark"] .nav-item.active{color:var(--gold-2);}
.nav-item svg{width:21px;height:21px;}
.nav-item span{font-size:10.5px;font-weight:600;}

/* Forms / Sheets */
.sheet-backdrop{position:fixed;inset:0;background:rgba(20,10,20,0.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-backdrop.open{opacity:1;pointer-events:auto;}
.sheet{width:100%;max-width:520px;max-height:92vh;background:var(--bg);border-radius:24px 24px 0 0;overflow-y:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom);}
.sheet-backdrop.open .sheet{transform:translateY(0);}
.sheet-handle{width:40px;height:4px;background:var(--line);border-radius:4px;margin:10px auto 4px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 4px;}
.sheet-head h3{margin:0;font-size:18px;}
.sheet-body{padding:6px 20px 24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14.5px;font-family:inherit;}
.field textarea{resize:vertical;min-height:70px;}
.field-inline{display:flex;gap:10px;align-items:center;}
.field-inline input{flex:1;}
.inline-field-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;cursor:pointer;white-space:nowrap;}
.inline-field-btn:active{transform:scale(0.97);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.form-actions{display:flex;gap:10px;margin-top:6px;}
.form-actions .btn{flex:1;}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;}
.tag-opt{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;}
.tag-opt.sel{background:var(--plum);color:#fff;border-color:var(--plum);}
[data-theme="dark"] .tag-opt.sel{background:var(--gold);color:#241A2C;border-color:var(--gold);}

/* Tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;}
.tab{padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--ink-soft);}
.tab.active{background:var(--plum);color:#fff;border-color:var(--plum);}
[data-theme="dark"] .tab.active{background:var(--gold);color:#241A2C;border-color:var(--gold);}

/* Search bar */
.search-bar{display:flex;gap:8px;margin-bottom:12px;}
.search-bar input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;}
.filter-btn{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}

/* Toast / confirm */
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:all .25s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast button{background:none;border:none;color:var(--gold-2);font-weight:700;margin-left:10px;cursor:pointer;}
.confirm-backdrop{position:fixed;inset:0;background:rgba(20,10,20,0.5);z-index:90;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px;}
.confirm-backdrop.open{opacity:1;pointer-events:auto;}
.confirm-box{background:var(--bg);border-radius:20px;padding:22px;max-width:340px;width:100%;box-shadow:var(--shadow);}
.confirm-box h3{margin:0 0 8px;font-size:17px;}
.confirm-box p{margin:0 0 18px;font-size:13.5px;color:var(--ink-soft);}

/* Wizard */
.wizard-backdrop{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;overflow-y:auto;}
.wizard-inner{max-width:480px;margin:0 auto;width:100%;padding:40px 24px 40px;}
.wizard-step-dots{display:flex;gap:6px;justify-content:center;margin:22px 0 8px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
.dot.active{background:var(--plum);width:20px;border-radius:4px;}

.loading-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.loading-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--plum),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:26px;font-weight:700;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

.pin-dots{display:flex;gap:14px;justify-content:center;margin:24px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-soft);}
.pin-dot.filled{background:var(--plum);border-color:var(--plum);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:280px;margin:0 auto;}
.pin-key{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600;cursor:pointer;color:var(--ink);}

.divider{height:1px;background:var(--line);margin:12px 0;}
.muted{color:var(--ink-soft);}
.text-ok{color:var(--ok);} .text-danger{color:var(--danger);} .text-warn{color:var(--warn);}
a.link{color:var(--plum);text-decoration:none;font-weight:600;}
[data-theme="dark"] a.link{color:var(--gold-2);}

@media print{
  .bottom-nav,.fab,.topbar,.icon-btn,.sheet-backdrop,.toast,.no-print{display:none !important;}
  body,#app{background:#fff;color:#000;max-width:100%;}
  main{padding:0;}
}
</style>
</head>
<body data-theme="light">
<div id="loadingScreen" class="loading-screen"><div class="loading-logo">B</div><div class="muted" style="font-size:13px">Loading Blossom Events ERP…</div></div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo">B</div>
      <div>
        <div class="brand-name" id="brandName">Blossom Events</div>
        <div class="brand-sub" id="brandSub">Event Business ERP</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle theme">🌓</button>
      <button class="icon-btn" onclick="Nav.go('settings')" title="Settings">⚙️</button>
    </div>
  </div>
  <main id="mainView"></main>
  <button class="fab" id="fabBtn">+</button>
  <nav class="bottom-nav">
    <button class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></button>
    <button class="nav-item" data-view="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Events</span></button>
    <button class="nav-item" data-view="finance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10h4.5a2 2 0 010 4H8.5"/></svg><span>Finance</span></button>
    <button class="nav-item" data-view="resources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg><span>Resources</span></button>

  </nav>
</div>

<div id="sheetBackdrop" class="sheet-backdrop"><div class="sheet" id="sheetContent"></div></div>
<div id="confirmBackdrop" class="confirm-backdrop"></div>
<div id="toast" class="toast"></div>
<div id="wizardRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
/* ============================================================
   BLOSSOM EVENTS ERP — CORE
   ============================================================ */

/* ---------------- UTILITIES ---------------- */
const Util = {
  uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,9); },
  money(n){ n = Number(n)||0; const cur = (App.settings && App.settings.currency) || '₹';
    const sign = n<0 ? '-' : ''; n = Math.abs(n);
    return sign+cur+n.toLocaleString('en-IN',{maximumFractionDigits:0}); },
  num(n){ return (Number(n)||0).toLocaleString('en-IN'); },
  date(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); },
  dateShort(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); },
  todayISO(){ return new Date().toISOString().slice(0,10); },
  toTS(iso){ return iso? new Date(iso+'T00:00:00').getTime() : Date.now(); },
  fromTS(ts){ return ts? new Date(ts).toISOString().slice(0,10) : Util.todayISO(); },
  esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  initials(name){ if(!name) return '?'; return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); },
  debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms||250); }; },
  monthKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); },
  isThisMonth(ts){ return Util.monthKey(ts)===Util.monthKey(Date.now()); },
  isToday(ts){ return new Date(ts).toDateString()===new Date().toDateString(); },
  sortByDateDesc(arr,key){ return [...arr].sort((a,b)=>(b[key]||0)-(a[key]||0)); },
};

/* ---------------- INDEXEDDB LAYER ---------------- */
const DB_NAME='BlossomEventsERP', DB_VERSION=1;
const STORES=['settings','partners','customers','events','payments','expenses','resources','reservations',
  'suppliers','supplierPayments','workers','attendance','workerPayments','wallets','ledger','partnerTx','activityLog'];
let _db=null;
function dbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      STORES.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'}); });
    };
    req.onsuccess=()=>{ _db=req.result; resolve(_db); };
    req.onerror=()=>reject(req.error);
  });
}
function tx(store,mode){ return _db.transaction(store,mode).objectStore(store); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r=tx(store,'readonly').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
function dbPut(store,obj){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); }); }
function dbDelete(store,id){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').delete(id); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); }); }
function dbClear(store){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').clear(); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); }); }

/* ---------------- APP STATE ---------------- */
const App = { settings:{}, cache:{}, view:'dashboard', viewParams:{} };
STORES.forEach(s=>{ if(s!=='settings') App.cache[s]=[]; });

function C(store){ return App.cache[store]; }
function findById(store,id){ return C(store).find(x=>x.id===id); }

async function addRecord(store,obj){
  obj.id = obj.id || Util.uid();
  obj.createdAt = obj.createdAt || Date.now();
  obj.updatedAt = Date.now();
  await dbPut(store,obj);
  C(store).push(obj);
  logActivity(`Added ${store.slice(0,-1)}: ${obj.name||obj.title||obj.id}`);
  return obj;
}
async function updateRecord(store,obj){
  obj.updatedAt = Date.now();
  await dbPut(store,obj);
  const i=C(store).findIndex(x=>x.id===obj.id);
  if(i>-1) C(store)[i]=obj; else C(store).push(obj);
  return obj;
}
async function deleteRecord(store,id){
  await dbDelete(store,id);
  App.cache[store] = C(store).filter(x=>x.id!==id);
}
async function logActivity(msg){
  const rec={id:Util.uid(),ts:Date.now(),msg};
  await dbPut('activityLog',rec);
  C('activityLog').push(rec);
}

async function addLedger({walletId,dir,amount,date,category,refType,refId,note}){

}
async function removeLedgerByRef(refType,refId){
  const items = C('ledger').filter(l=>l.refType===refType && l.refId===refId);

function walletBalance(walletId){
  const w = findById('wallets',walletId); if(!w) return 0;
  let bal = Number(w.opening)||0;
  C('ledger').forEach(l=>{ if(l.walletId===walletId){ bal += (l.dir==='in'? l.amount : -l.amount); } });
  return bal;
}
function totalCash(){ return C('wallets').reduce((s,w)=>s+walletBalance(w.id),0); }

let _toastTimer=null;
function toast(msg, undoFn){
  const t=document.getElementById('toast');
  t.innerHTML = Util.esc(msg) + (undoFn? ` <button onclick="(${undoWrap.toString()})()">UNDO</button>`:'');
  if(undoFn) window.__lastUndo=undoFn;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'), 3800);
}
function undoWrap(){ if(window.__lastUndo){ window.__lastUndo(); window.__lastUndo=null; document.getElementById('toast').classList.remove('show'); } }

function confirmDialog(title,msg,onYes,okLabel){
  const el=document.getElementById('confirmBackdrop');
  el.innerHTML = `<div class="confirm-box">
    <h3>${Util.esc(title)}</h3><p>${Util.esc(msg)}</p>

      <button class="btn btn-danger" id="confirmYesBtn">${Util.esc(okLabel||'Delete')}</button>
    </div></div>`;
  el.classList.add('open');

}

/* ---------------- FIELD RENDERER (shared by all entity forms) ---------------- */
function renderField(f, val){
  val = val===undefined? (f.default!==undefined?f.default:'') : val;
  const id = 'f_'+f.key;
  if(f.type==='select'){
    return `<div class="field"><label>${f.label}${f.required?' *':''}</label>
      <select id="${id}">${f.options.map(o=>{
        const ov = typeof o==='object'? o.value : o; const ol = typeof o==='object'? o.label : o;
        return `<option value="${Util.esc(ov)}" ${val===ov?'selected':''}>${Util.esc(ol)}</option>`;
      }).join('')}</select></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field"><label>${f.label}</label><textarea id="${id}">${Util.esc(val)}</textarea></div>`;
  }
  if(f.type==='image'){
    return `<div class="field"><label>${f.label}</label>
      <input type="file" accept="image/*" id="${id}_file" onchange="handleImageInput('${id}')">
      <input type="hidden" id="${id}" value="${Util.esc(val)}">
      <div id="${id}_preview" style="margin-top:8px;">${val?`<img src="${val}" style="width:64px;height:64px;object-fit:cover;border-radius:12px;">`:''}</div></div>`;
  }
  if(f.key==='customerName'){
    return `<div class="field"><label>${f.label}${f.required?' *':''}</label>
      <div class="field-inline">
        <input type="${f.type||'text'}" id="${id}" value="${Util.esc(val)}" ${f.step?`step="${f.step}"`:''} placeholder="${Util.esc(f.placeholder||'')}">
        <button type="button" class="inline-field-btn" onclick="pickCustomerContact()">📇</button>
      </div></div>`;
  }
  return `<div class="field"><label>${f.label}${f.required?' *':''}</label>
    <input type="${f.type||'text'}" id="${id}" value="${Util.esc(val)}" ${f.step?`step="${f.step}"`:''} placeholder="${Util.esc(f.placeholder||'')}"></div>`;
}
function handleImageInput(id){
  const file = document.getElementById(id+'_file').files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload=()=>{
    document.getElementById(id).value = reader.result;
    document.getElementById(id+'_preview').innerHTML = `<img src="${reader.result}" style="width:64px;height:64px;object-fit:cover;border-radius:12px;">`;
  };
  reader.readAsDataURL(file);
}
function readFieldValue(f){
  const el=document.getElementById('f_'+f.key); if(!el) return f.default;
  let v = el.value;
  if(f.type==='number') v = v===''? 0 : Number(v);
  return v;
}
function validateFields(fields){
  for(const f of fields){ if(f.required){ const v=readFieldValue(f); if(v===''||v===null||v===undefined){ toast(`${f.label} is required`); return false; } } }
  return true;
}

function supportsContactPicker(){
  return ('contacts' in navigator) && ('ContactsManager' in window);
}
async function pickCustomerContact(){
  if(!supportsContactPicker()){
    toast('Contacts import requires a compatible browser on mobile.');
    return;
  }
  try{
    const props = ['name','tel'];
    const opts = {multiple:false};
    const contacts = await navigator.contacts.select(props, opts);
    if(!contacts || !contacts.length) return;
    const contact = contacts[0];
    const name = (contact.name && contact.name[0]) || '';
    const phone = (contact.tel && contact.tel[0]) || '';
    const nameEl = document.getElementById('f_customerName');
    if(nameEl) nameEl.value = name;
    const phoneEl = document.getElementById('f_customerPhone');
    if(phoneEl) phoneEl.value = phone;
  }catch(err){
    toast('Could not open contacts');
  }
}

/* ============================================================
   GENERIC ENTITY ENGINE
   ============================================================ */
function makeEntity(cfg){
  return {
    cfg,
    list(q){
      let items = C(cfg.store);
      if(q) items = items.filter(it=>cfg.search(it,q.toLowerCase()));
      return Util.sortByDateDesc(items,'createdAt');
    },
    render(q){
      const items = this.list(q);
      if(!items.length){
        return `<div class="empty"><div class="empty-icon">${cfg.icon}</div>
          <div class="empty-title">No ${cfg.plural.toLowerCase()} yet</div>
          <div class="empty-sub">${cfg.emptyHint||'Add your first record to get started.'}</div>
          <button class="btn btn-primary" onclick="Entities.${cfg.store}.openForm()">+ Add ${cfg.singular}</button></div>`;
      }
      return items.map(it=>cfg.row(it)).join('');
    },
    openForm(id){
      const existing = id? findById(cfg.store,id) : null;
      const fieldsHtml = cfg.fields.map(f=>renderField(f, existing? existing[f.key] : f.default)).join('');
      openSheet((existing?'Edit ':'Add ')+cfg.singular, `
        <div>${fieldsHtml}</div>
        <div class="form-actions">
          ${existing?`<button class="btn btn-danger" onclick="Entities.${cfg.store}.remove('${existing.id}')">Delete</button>`:''}
          <button class="btn btn-primary btn-block" onclick="Entities.${cfg.store}.save(${existing?`'${existing.id}'`:'null'})">Save ${cfg.singular}</button>
        </div>`);
    },
    async save(id){
      if(!validateFields(cfg.fields)) return;
      const obj = id? {...findById(cfg.store,id)} : {};
      cfg.fields.forEach(f=>{ obj[f.key]=readFieldValue(f); });
      if(cfg.beforeSave) cfg.beforeSave(obj);
      if(id) await updateRecord(cfg.store,obj); else await addRecord(cfg.store,obj);
      closeSheet();
      toast(`${cfg.singular} saved`);
      Nav.go(App.view);
    },
    remove(id){
      const item=findById(cfg.store,id);
      confirmDialog(`Delete ${cfg.singular}?`, `This will permanently remove "${item.name||''}". This cannot be undone.`, async ()=>{
        await deleteRecord(cfg.store,id);
        closeSheet();
        toast(`${cfg.singular} deleted`);
        Nav.go(App.view);
      });
    }
  };
}

/* ---------------- CALC HELPERS shared across modules ---------------- */
function eventReceived(eventId){ return C('payments').filter(p=>p.eventId===eventId).reduce((s,p)=>s+p.amount,0); }
function eventExpenses(eventId){ return C('expenses').filter(e=>e.eventId===eventId).reduce((s,e)=>s+e.amount,0)
  + C('workerPayments').filter(w=>w.eventId===eventId).reduce((s,w)=>s+w.amount,0); }
function eventProfit(ev){ return (Number(ev.contractAmount)||0) - eventExpenses(ev.id); }
function reservedQty(resourceId){
  return C('reservations').filter(r=>r.resourceId===resourceId && r.status!=='returned').reduce((s,r)=>s+(Number(r.qty)-Number(r.returnedQty||0)),0);
}
function supplierOutstanding(supplierId){
  const supplied = C('resources').filter(r=>r.supplierId===supplierId).reduce((s,r)=>s+(Number(r.rentalPrice)||0),0);
  const expenseOwed = C('expenses').filter(e=>e.supplierId===supplierId).reduce((s,e)=>s+e.amount,0);
  const paid = C('supplierPayments').filter(p=>p.supplierId===supplierId).reduce((s,p)=>s+p.amount,0);
  return Math.max(0, expenseOwed - paid);
}
function workerPendingWage(workerId){
  const present = C('attendance').filter(a=>a.workerId===workerId);
  const worker = findById('workers',workerId);
  const wage = Number(worker&&worker.dailyWage)||0;
  const earned = present.reduce((s,a)=>{
    if(a.status==='present') return s+wage;
    if(a.status==='half') return s+wage/2;
    if(a.status==='late') return s+wage;
    return s;
  },0);
  const paid = C('workerPayments').filter(p=>p.workerId===workerId).reduce((s,p)=>s+p.amount,0);
  return Math.max(0, earned-paid);
}

        <div class="field"><label>Business Name *</label><input id="wBizName" value="${Util.esc(this.data.bizName)}" placeholder="Blossom Events"></div>

        if(v && !/^\d{4}$/.test(v)){ toast('PIN must be 4 digits'); return false; }
        this.data.pin=v; return true;
      });

      body=`<div class="wizard-inner">
        <div class="wizard-step-dots">${this.dots()}</div>
        <h2 class="serif" style="font-size:20px;">Default partners</h2>
        <p class="muted" style="font-size:13px;margin-bottom:16px;">We'll create these two partners to start. You can add, edit or remove partners anytime later.</p>
        <div class="card"><div class="row-title">Hamza</div><div class="row-sub muted">Partner, 50% profit share</div></div>
        <div class="card"><div class="row-title">Siddik</div><div class="row-sub muted">Partner, 50% profit share</div></div>
        <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="Wizard.finish()">Create Business</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="Wizard.back()">Back</button>
      </div>`;

    document.getElementById('wizBackdrop').innerHTML = body;
  },
  shell(title, fieldsHtml, onNext){
    this._onNext = onNext;
    return `<div class="wizard-inner">
      <div class="wizard-step-dots">${this.dots()}</div>
      <h2 class="serif" style="font-size:20px;">${title}</h2>
      <div style="margin-top:16px;">${fieldsHtml}</div>
      <div class="form-actions" style="margin-top:20px;">
        ${this.step>0?`<button class="btn btn-ghost" onclick="Wizard.back()">Back</button>`:''}

    if(this._onNext && this._onNext()===false) return;
    this.step++;

  },
  back(){ this.step--; this.render(); },
  async finish(){

    await addRecord('wallets',{name:'Bank',type:'Bank',opening:0});
    await addRecord('wallets',{name:'UPI',type:'UPI',opening:0});
    document.getElementById('wizardRoot').innerHTML='';
    startApp();
    toast('Welcome! Your business is set up.');
  }
};

const PinLock = {
  entered:'',
  show(onSuccess){
    this.onSuccess=onSuccess; this.entered='';
    document.getElementById('wizardRoot').innerHTML = `<div class="wizard-backdrop" style="justify-content:center;align-items:center;display:flex;">
      <div class="wizard-inner" style="text-align:center;">
        <div class="loading-logo" style="margin:0 auto;">${Util.initials(App.settings.bizName||'B')[0]}</div>
        <h2 class="serif" style="margin-top:16px;">Enter PIN</h2>
        <div class="pin-dots" id="pinDots">${'<div class="pin-dot"></div>'.repeat(4)}</div>
        <div class="pin-pad" id="pinPad"></div>
      </div></div>`;
    this.renderPad();
  },
  renderPad(){
    const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
    document.getElementById('pinPad').innerHTML = keys.map(k=>{
      if(k==='') return `<div></div>`;
      return `<button class="pin-key" onclick="PinLock.press('${k}')">${k}</button>`;
    }).join('');
  },
  press(k){
    if(k==='⌫'){ this.entered=this.entered.slice(0,-1); }
    else if(this.entered.length<4){ this.entered+=k; }
    document.querySelectorAll('.pin-dot').forEach((d,i)=>d.classList.toggle('filled', i<this.entered.length));
    if(this.entered.length===4){
      setTimeout(()=>{
        if(this.entered===App.settings.pin){
          document.getElementById('wizardRoot').innerHTML='';
          this.onSuccess();
        } else {
          toast('Incorrect PIN'); this.entered='';
          document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('filled'));
        }
      },150);
    }
  }
};

const Views = {};

function businessHealth(){
  const cash = totalCash();
  const pending = C('events').reduce((s,e)=>s+Math.max(0,(Number(e.contractAmount)||0)-eventReceived(e.id)),0);
  const payable = C('suppliers').reduce((s,sup)=>s+supplierOutstanding(sup.id),0) + C('workers').reduce((s,w)=>s+workerPendingWage(w.id),0);
  return { cash, pending, payable, health: cash+pending-payable };
}

let _dashChartInst=null;
function drawDashChart(){
  const el = document.getElementById('dashChart'); if(!el || typeof Chart==='undefined') return;
  const months = [];
  for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  const labels = months.map(m=>{ const [y,mo]=m.split('-'); return new Date(y,mo-1).toLocaleDateString('en-IN',{month:'short'}); });
  const rev = months.map(m=>C('payments').filter(p=>Util.monthKey(Util.toTS(p.date))===m).reduce((s,p)=>s+p.amount,0));
  const exp = months.map(m=>C('expenses').filter(e=>Util.monthKey(Util.toTS(e.date))===m).reduce((s,e)=>s+e.amount,0)
    + C('workerPayments').filter(w=>Util.monthKey(Util.toTS(w.date))===m).reduce((s,w)=>s+w.amount,0));
  if(_dashChartInst) _dashChartInst.destroy();
  const styles=getComputedStyle(document.body);
  _dashChartInst = new Chart(el, { type:'bar', data:{ labels, datasets:[
    {label:'Revenue', data:rev, backgroundColor: styles.getPropertyValue('--gold')||'#C9A15A', borderRadius:6},
    {label:'Expense', data:exp, backgroundColor: styles.getPropertyValue('--plum')||'#4A1942', borderRadius:6},
  ]}, options:{ responsive:true, plugins:{legend:{labels:{color:styles.getPropertyValue('--ink')}}}, scales:{
    x:{ticks:{color:styles.getPropertyValue('--ink-soft')},grid:{display:false}},
    y:{ticks:{color:styles.getPropertyValue('--ink-soft')},grid:{color:styles.getPropertyValue('--line')}}
  }}});
}

const EVENT_TIMELINE = ['Booked','Advance Received','Planning','Resource Ready','Decoration Started','Event Running','Completed','Payment Pending','Closed'];
const EventsUI = {
  filter:'All', query:'', actionsCollapsed:true,
  statusChip(status){
    const map={Booked:'neutral','Advance Received':'plum',Planning:'neutral','Resource Ready':'neutral','Decoration Started':'warn','Event Running':'warn',Completed:'ok','Payment Pending':'danger',Closed:'ok'};
    return `<span class="chip ${map[status]||'neutral'}">${Util.esc(status||'Booked')}</span>`;
  },
  toggleActions(){ this.actionsCollapsed = !this.actionsCollapsed; Views.refreshCurrent(); },
  row(e){
    const received = eventReceived(e.id); const pending = Math.max(0,(Number(e.contractAmount)||0)-received);
    return `<div class="list-row" onclick="Nav.go('eventDetail',{id:'${e.id}'})">
      <div class="avatar">🎉</div>
      <div class="row-main"><div class="row-title">${Util.esc(e.title||'Untitled Event')}</div>
        <div class="row-sub">${Util.esc(e.customerName||'')} · ${Util.dateShort(Util.toTS(e.eventDate))}</div></div>
      <div class="row-end">${this.statusChip(e.status)}<div class="row-amt" style="margin-top:3px;">${pending>0?Util.money(pending)+' due':Util.money(e.contractAmount)}</div></div>
    </div>`;
  },
  list(){
    let items = C('events');
    if(this.filter==='Archived') {
      items = items.filter(e=>e.archived);
    } else {
      items = items.filter(e=>!e.archived);
      if(this.filter!=='All') items = items.filter(e=>e.status===this.filter);
    }
    if(this.query){ const q=this.query.toLowerCase(); items = items.filter(e=>(e.title||'').toLowerCase().includes(q)||(e.customerName||'').toLowerCase().includes(q)); }
    return Util.sortByDateDesc(items,'eventDate');
  },
  fields(){
    return [
      {key:'title',label:'Event Name',required:true,placeholder:'e.g. Aaris and Fouziya Wedding'},
      {key:'customerName',label:'Customer Name',required:true},
      {key:'customerPhone',label:'Phone',type:'tel',required:true},
      {key:'customerWhatsapp',label:'WhatsApp Number',type:'tel'},
      {key:'location',label:'Venue / Location'},
      {key:'mapLink',label:'Google Map Link (optional)'},
      {key:'bookingDate',label:'Booking Date',type:'date',default:Util.todayISO()},
      {key:'eventDate',label:'Event Date',type:'date',required:true},
      {key:'startTime',label:'Start Time',type:'time'},
      {key:'endTime',label:'End Time',type:'time'},
      {key:'contractAmount',label:'Contract Amount',type:'number',required:true},
      {key:'priority',label:'Priority',type:'select',options:['Low','Medium','High'],default:'Medium'},
      {key:'assignedPartnerId',label:'Assigned Partner',type:'select',options:()=>[{value:'',label:'— Unassigned —'},...C('partners').map(p=>({value:p.id,label:p.name}))]},
      {key:'status',label:'Status',type:'select',options:EVENT_TIMELINE,default:'Booked'},
      {key:'notes',label:'Notes',type:'textarea'},
    ];
  },
  openForm(id){
    const ev = id? findById('events',id) : null;
    const fieldsHtml = this.fields().map(f=>renderField(f, ev? ev[f.key] : f.default)).join('');
    openSheet((ev?'Edit ':'New ')+'Event', `<div>${fieldsHtml}</div>
      <div class="form-actions">
        ${ev?`<button class="btn btn-danger" onclick="EventsUI.remove('${ev.id}')">Delete</button>`:''}
        <button class="btn btn-primary btn-block" onclick="EventsUI.save(${ev?`'${ev.id}'`:'null'})">Save Event</button>
      </div>`);
  },
  async save(id){
    if(!validateFields(this.fields())) return;
    const obj = id? {...findById('events',id)} : {};
    this.fields().forEach(f=>{ obj[f.key]=readFieldValue(f); });
    let cust = C('customers').find(c=>c.phone===obj.customerPhone);
    if(!cust && obj.customerPhone){ cust = await addRecord('customers',{name:obj.customerName,phone:obj.customerPhone,whatsapp:obj.customerWhatsapp}); }
    obj.customerId = cust? cust.id : obj.customerId;
    if(id) await updateRecord('events',obj); else await addRecord('events',obj);
    closeSheet(); toast('Event saved');
    Nav.go('eventDetail', {id:obj.id, tab: App.view==='eventDetail'? App.viewParams.tab : undefined});
  },
  remove(id){
    confirmDialog('Delete event?','This removes the event and its linked payments, expenses, reservations and attendance records. This cannot be undone.', async ()=>{
      for(const store of ['payments','expenses','reservations','attendance','workerPayments']){
        for(const x of C(store).filter(x=>x.eventId===id)){ await deleteRecord(store,x.id); }
      }
      await removeLedgerByRef('event',id);
      await deleteRecord('events',id);
      closeSheet(); toast('Event deleted'); Nav.go('events');
    });
  },
  async duplicate(id){
    const ev = {...findById('events',id)};
    delete ev.id; delete ev.createdAt; delete ev.updatedAt;
    ev.title = ev.title+' (Copy)'; ev.status='Booked';
    const created = await addRecord('events',ev);
    toast('Event duplicated'); Nav.go('eventDetail',{id:created.id});
  },
  archive(id){
    confirmDialog('Archive event?','Archived events are hidden from the main list but not deleted.', async ()=>{
      const ev={...findById('events',id)}; ev.archived=true; await updateRecord('events',ev);
      toast('Event archived'); Nav.go('events');
    }, 'Archive');
  },
  restore(id){ const ev={...findById('events',id)}; ev.archived=false; updateRecord('events',ev).then(()=>{ toast('Event restored'); Nav.go('eventDetail',{id}); }); },
  setStatus(id,status){ const ev={...findById('events',id)}; ev.status=status; updateRecord('events',ev).then(()=>Nav.go('eventDetail',{id})); },
  closeEvent(id){
    const ev = findById('events',id);
    const pending = Math.max(0,(Number(ev.contractAmount)||0)-eventReceived(id));
    confirmDialog('Close this event?', pending>0? `There is ${Util.money(pending)} still pending from the customer. Closing will mark the event Closed and lock in final numbers.` : 'This will mark the event Closed and lock in final numbers.', async ()=>{
      const e2={...ev}; e2.status='Closed'; await updateRecord('events',e2);
      toast('Event closed'); Nav.go('eventDetail',{id});
    }, 'Close Event');
  },

  async savePayment(eventId){
    const amount=Number(document.getElementById('pAmount').value)||0;
    if(amount<=0){ toast('Enter a valid amount'); return; }
    const walletId=document.getElementById('pWallet').value;
    const date=document.getElementById('pDate').value;
    const p = await addRecord('payments',{eventId, customerId:findById('events',eventId).customerId, date, amount,
      mode:document.getElementById('pMode').value, wallet:walletId, ref:document.getElementById('pRef').value,

    const file=document.getElementById('evPhotoFile').files[0]; if(!file){ toast('Choose a photo'); return; }

Views.events = function(){

    ? C('events').filter(e=>e.archived).length
    : C('events').filter(e=>!e.archived).length;
  const subText = EventsUI.filter==='Archived' ? `${total} archived events` : `${total} total events`;
  const emptyState = EventsUI.filter==='Archived'
    ? `<div class="empty"><div class="empty-icon">🗄️</div><div class="empty-title">No archived events</div><div class="empty-sub">Restore events from the archived tab if needed.</div></div>`
    : `<div class="empty"><div class="empty-icon">🎉</div><div class="empty-title">No events found</div><div class="empty-sub">Try a different filter, or add your first event.</div><button class="btn btn-primary" onclick="EventsUI.openForm()">+ New Event</button></div>`;

    <div class="view-title">Events</div>
    <div class="view-sub">${subText}</div>

};

Views.eventDetail = function(params){
  const ev = findById('events', params.id);
  if(!ev) return `<div class="empty"><div class="empty-icon">🌸</div><div class="empty-title">Event not found</div></div>`;
  const tab = params.tab || 'overview';
  const received = eventReceived(ev.id); const expense = eventExpenses(ev.id);
  const pending = Math.max(0,(Number(ev.contractAmount)||0)-received);
  const profit = eventProfit(ev);
  const tabs=[['overview','Overview'],['payments','Payments'],['expenses','Expenses'],['resources','Resources'],['workers','Workers'],['photos','Photos & Docs']];

  let body='';
  if(tab==='overview'){
    body = `
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div><div class="row-title" style="font-size:16px;">${Util.esc(ev.customerName)}</div><div class="row-sub">${Util.esc(ev.customerPhone||'')}</div></div>
        ${EventsUI.statusChip(ev.status)}
      </div>
      <div class="divider"></div>
      <div class="row-sub">📍 ${Util.esc(ev.location||'No location set')}</div>
      ${ev.mapLink?`<div class="row-sub"><a class="link" href="${Util.esc(ev.mapLink)}" target="_blank">Open in Maps</a></div>`:''}
      <div class="row-sub">📅 ${Util.date(Util.toTS(ev.eventDate))} ${ev.startTime?('· '+ev.startTime+(ev.endTime?'–'+ev.endTime:'')):''}</div>
      <div class="row-sub">Priority: ${Util.esc(ev.priority||'Medium')} · Partner: ${Util.esc((findById('partners',ev.assignedPartnerId)||{}).name||'Unassigned')}</div>
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="v">${Util.money(ev.contractAmount)}</div><div class="l">Contract Amount</div></div>
        <div class="stat-card ok"><div class="v">${Util.money(received)}</div><div class="l">Received</div></div>
        <div class="stat-card ${pending>0?'warn':'ok'}"><div class="v">${Util.money(pending)}</div><div class="l">Pending Balance</div></div>
        <div class="stat-card ${profit>=0?'ok':'danger'}"><div class="v">${Util.money(profit)}</div><div class="l">Profit So Far</div></div>
      </div>
      <div class="section-label">Move Timeline</div>
      <div class="tag-row">${EVENT_TIMELINE.map(s=>`<div class="tag-opt ${ev.status===s?'sel':''}" onclick="EventsUI.setStatus('${ev.id}','${s}')">${s}</div>`).join('')}</div>
      ${ev.notes?`<div class="section-label">Notes</div><div class="card">${Util.esc(ev.notes)}</div>`:''}
      <div class="section-label">
        Actions
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); EventsUI.toggleActions()">${EventsUI.actionsCollapsed?'⬇️ Expand':'⬆️ Collapse'}</button>
      </div>
      ${EventsUI.actionsCollapsed ? `<div class="card muted" style="padding:16px;">Actions are collapsed. Tap expand to show action buttons.</div>` : `<div class="card" style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn btn-ghost btn-block" onclick="EventsUI.openForm('${ev.id}')">✏️ Edit Event</button>
        <button class="btn btn-ghost btn-block" onclick="EventsUI.duplicate('${ev.id}')">📄 Duplicate</button>
        <button class="btn btn-ghost btn-block" onclick="EventsUI.printEvent('${ev.id}')">🖨️ Print / PDF</button>
        ${ev.archived? `<button class="btn btn-ghost btn-block" onclick="EventsUI.restore('${ev.id}')">↩️ Restore</button>` : `<button class="btn btn-ghost btn-block" onclick="EventsUI.archive('${ev.id}')">🗄️ Archive</button>`}
        ${ev.status!=='Closed'?`<button class="btn btn-gold btn-block" onclick="EventsUI.closeEvent('${ev.id}')">✅ Close Event</button>`:''}
        <button class="btn btn-danger btn-block" onclick="EventsUI.remove('${ev.id}')">🗑️ Delete Event</button>
      </div>`}
`;
  } else if(tab==='payments'){
    const pays = Util.sortByDateDesc(C('payments').filter(p=>p.eventId===ev.id),'date');
    body = `<button class="btn btn-primary btn-block" onclick="EventsUI.openPaymentForm('${ev.id}')">+ Record Payment</button><div style="height:12px"></div>`
      + (pays.length? pays.map(p=>`<div class="list-row" onclick="EventsUI.removePayment('${p.id}','${ev.id}')">
          <div class="avatar">💵</div><div class="row-main"><div class="row-title">${Util.money(p.amount)}</div><div class="row-sub">${Util.esc(p.mode||'')} · ${Util.date(Util.toTS(p.date))}</div></div>
          <div class="row-end"><span class="chip neutral">${Util.esc((findById('wallets',p.wallet)||{}).name||'')}</span></div></div>`).join('')
        : `<div class="empty"><div class="empty-icon">💵</div><div class="empty-title">No payments yet</div></div>`);
  } else if(tab==='expenses'){
    const exps = Util.sortByDateDesc(C('expenses').filter(e=>e.eventId===ev.id),'date');
    body = `<button class="btn btn-primary btn-block" onclick="ExpensesUI.openForm(null,'${ev.id}')">+ Add Expense</button><div style="height:12px"></div>`
      + (exps.length? exps.map(e=>`<div class="list-row" onclick="ExpensesUI.openForm('${e.id}','${ev.id}')">
          <div class="avatar">🧾</div><div class="row-main"><div class="row-title">${Util.esc(e.category)}</div><div class="row-sub">${Util.date(Util.toTS(e.date))}</div></div>
          <div class="row-end"><div class="row-amt">${Util.money(e.amount)}</div></div></div>`).join('')
        : `<div class="empty"><div class="empty-icon">🧾</div><div class="empty-title">No expenses logged</div></div>`);
  } else if(tab==='resources'){
    const rsv = C('reservations').filter(r=>r.eventId===ev.id);
    body = `<button class="btn btn-primary btn-block" onclick="EventsUI.openReserveForm('${ev.id}')">+ Reserve Resource</button><div style="height:12px"></div>`
      + (rsv.length? rsv.map(r=>{ const res=findById('resources',r.resourceId)||{name:'Deleted'};
          return `<div class="list-row">
          <div class="avatar">🎪</div><div class="row-main"><div class="row-title">${Util.esc(res.name)}</div><div class="row-sub">Qty ${r.qty} · ${r.status==='returned'?'Returned':'Out'} · ${Util.dateShort(Util.toTS(r.date))}</div></div>
          <div class="row-end">${r.status!=='returned'?`<button class="btn btn-ghost btn-sm" onclick="EventsUI.returnReservation('${r.id}','${ev.id}')">Return</button>`:'<span class="chip ok">Returned</span>'}</div></div>`;
        }).join('') : `<div class="empty"><div class="empty-icon">🎪</div><div class="empty-title">No resources reserved</div></div>`);
  } else if(tab==='workers'){
    const att = Util.sortByDateDesc(C('attendance').filter(a=>a.eventId===ev.id),'date');
    const pays = Util.sortByDateDesc(C('workerPayments').filter(p=>p.eventId===ev.id),'date');
    body = `<div class="tag-row" style="margin-bottom:12px;">
        <button class="btn btn-primary btn-sm" onclick="EventsUI.openAssignWorkerForm('${ev.id}')">+ Attendance</button>
        <button class="btn btn-gold btn-sm" onclick="EventsUI.openWorkerPayForm('${ev.id}')">+ Pay Worker</button>
      </div>
      <div class="section-label">Attendance</div>
      ${att.length? att.map(a=>{ const w=findById('workers',a.workerId)||{name:'Deleted'};
        return `<div class="list-row" onclick="EventsUI.removeAttendance('${a.id}','${ev.id}')">
        <div class="avatar">👷</div><div class="row-main"><div class="row-title">${Util.esc(w.name)}</div><div class="row-sub">${Util.dateShort(Util.toTS(a.date))}</div></div>
        <div class="row-end"><span class="chip neutral">${a.status}</span></div></div>`; }).join('') : `<div class="empty" style="padding:20px;"><div class="empty-sub">No attendance recorded</div></div>`}
      <div class="section-label">Payments</div>
      ${pays.length? pays.map(p=>{ const w=findById('workers',p.workerId)||{name:'Deleted'};
        return `<div class="list-row"><div class="avatar">💸</div><div class="row-main"><div class="row-title">${Util.esc(w.name)}</div><div class="row-sub">${Util.dateShort(Util.toTS(p.date))}</div></div>
        <div class="row-end"><div class="row-amt">${Util.money(p.amount)}</div></div></div>`; }).join('') : `<div class="empty" style="padding:20px;"><div class="empty-sub">No worker payments</div></div>`}`;
  } else if(tab==='photos'){
    const photos = ev.photos||[];
    body = `<button class="btn btn-primary btn-block" onclick="EventsUI.openPhotoUpload('${ev.id}')">+ Add Photo</button><div style="height:12px"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">${photos.map((p,i)=>`<div style="position:relative;"><img src="${p}" style="width:100%;height:120px;object-fit:cover;border-radius:12px;"><button class="icon-btn" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.5);color:#fff;border:none;" onclick="EventsUI.removePhoto('${ev.id}',${i})">✕</button></div>`).join('')}</div>
      ${!photos.length?`<div class="empty"><div class="empty-icon">📷</div><div class="empty-title">No photos yet</div></div>`:''}
      <div class="section-label">Agreement / Document Notes</div>
      <div class="card muted" style="font-size:13px;">${ev.notes? Util.esc(ev.notes) : 'Add agreement references or document notes from Edit Event → Notes.'}</div>`;
  }

  return `
    <div class="view-title">${Util.esc(ev.title||'Event')}</div>
    <div class="view-sub">${Util.date(Util.toTS(ev.eventDate))} · ${Util.esc(ev.status)}</div>
    <div class="tabs">${tabs.map(([k,l])=>`<div class="tab ${tab===k?'active':''}" onclick="Nav.go('eventDetail',{id:'${ev.id}',tab:'${k}'})">${l}</div>`).join('')}</div>
    ${body}
  `;
};

const FinanceUI = {
  tab:'wallets',
  openWalletForm(id){ Entities.wallets.openForm(id); },
  openTxForm(){ this.openTransferForm(); },
  openTransferForm(){
    if(C('wallets').length<2){ toast('Add at least two wallets first'); return; }
    openSheet('Transfer Between Wallets', `
      <div class="field"><label>From Wallet</label><select id="tfFrom">${walletOptions().map(w=>`<option value="${w.value}">${w.label}</option>`).join('')}</select></div>
      <div class="field"><label>To Wallet</label><select id="tfTo">${walletOptions().map(w=>`<option value="${w.value}">${w.label}</option>`).join('')}</select></div>
      <div class="field"><label>Amount *</label><input type="number" id="tfAmount"></div>
      <div class="field"><label>Date</label><input type="date" id="tfDate" value="${Util.todayISO()}"></div>
      <div class="field"><label>Note</label><input id="tfNote"></div>
      <button class="btn btn-primary btn-block" onclick="FinanceUI.saveTransfer()">Transfer</button>`);
  },
  async saveTransfer(){
    const from=document.getElementById('tfFrom').value, to=document.getElementById('tfTo').value;
    const amount=Number(document.getElementById('tfAmount').value)||0;
    if(from===to){ toast('Choose two different wallets'); return; }
    if(amount<=0){ toast('Enter a valid amount'); return; }
    const date=document.getElementById('tfDate').value, note=document.getElementById('tfNote').value;
    const refId=Util.uid();
    await addLedger({walletId:from,dir:'out',amount,date,category:'Transfer Out',refType:'transfer',refId,note});
    await addLedger({walletId:to,dir:'in',amount,date,category:'Transfer In',refType:'transfer',refId,note});
    closeSheet(); toast('Transfer complete'); Nav.go('finance');
  },
  openPartnerTxForm(type, partnerId){
    const partners = C('partners');
    openSheet(type==='investment'?'Record Investment':'Record Withdrawal', `
      <div class="field"><label>Partner</label><select id="ptPartner">${partners.map(p=>`<option value="${p.id}" ${p.id===partnerId?'selected':''}>${Util.esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Amount *</label><input type="number" id="ptAmount"></div>
      <div class="field"><label>Date</label><input type="date" id="ptDate" value="${Util.todayISO()}"></div>

      <div class="field"><label>Notes</label><textarea id="ptNote"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="FinanceUI.savePartnerTx('${type}')">Save</button>`);
  },
  openPartnerTxEditForm(txId){
    const tx = findById('partnerTx', txId);
    if(!tx){ toast('Transaction not found'); return; }
    const partners = C('partners');
    openSheet(tx.type==='investment'?'Edit Investment':'Edit Withdrawal', `
      <div class="field"><label>Partner</label><select id="ptPartner">${partners.map(p=>`<option value="${p.id}" ${p.id===tx.partnerId?'selected':''}>${Util.esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Amount *</label><input type="number" id="ptAmount" value="${Util.esc(tx.amount)}"></div>
      <div class="field"><label>Date</label><input type="date" id="ptDate" value="${Util.esc(tx.date)}"></div>
      <div class="field"><label>Wallet</label><select id="ptWallet">${walletOptions().map(w=>`<option value="${w.value}" ${tx.wallet===w.value?'selected':''}>${w.label}</option>`).join('')}</select></div>
      <div class="field"><label>Notes</label><textarea id="ptNote">${Util.esc(tx.note||'')}</textarea></div>
      <button class="btn btn-primary btn-block" onclick="FinanceUI.savePartnerTxEdit('${txId}')">Update</button>`);
  },
  async savePartnerTx(type){
    const amount=Number(document.getElementById('ptAmount').value)||0; if(amount<=0){ toast('Enter a valid amount'); return; }
    const walletId=document.getElementById('ptWallet').value, date=document.getElementById('ptDate').value;
    const partnerId=document.getElementById('ptPartner').value;
    const rec = await addRecord('partnerTx',{partnerId,type,amount,date,wallet:walletId,note:document.getElementById('ptNote').value});
    await addLedger({walletId, dir: type==='investment'?'in':'out', amount, date, category:type==='investment'?'Partner Investment':'Partner Withdrawal', refType:'partnerTx', refId:rec.id, note:''});
    closeSheet(); toast('Saved'); Nav.go(App.view==='partnerProfile'?'partnerProfile':'finance', App.viewParams);
  },
  async savePartnerTxEdit(txId){
    const tx = findById('partnerTx', txId);
    if(!tx){ toast('Transaction not found'); return; }
    const amount=Number(document.getElementById('ptAmount').value)||0; if(amount<=0){ toast('Enter a valid amount'); return; }
    const walletId=document.getElementById('ptWallet').value, date=document.getElementById('ptDate').value;
    const updated = {...tx, partnerId:document.getElementById('ptPartner').value, amount, date, wallet:walletId, note:document.getElementById('ptNote').value};
    await updateRecord('partnerTx', updated);
    await removeLedgerByRef('partnerTx', txId);
    await addLedger({walletId, dir: tx.type==='investment'?'in':'out', amount, date, category:tx.type==='investment'?'Partner Investment':'Partner Withdrawal', refType:'partnerTx', refId:txId, note:''});
    closeSheet(); toast('Transaction updated'); Nav.go(App.view==='partnerProfile'?'partnerProfile':'finance', App.viewParams);
  },
  removePartnerTx(id){
    confirmDialog('Delete entry?','This removes the investment/withdrawal record and its wallet entry.', async ()=>{
      await removeLedgerByRef('partnerTx',id); await deleteRecord('partnerTx',id);
      toast('Deleted'); Nav.go(App.view, App.viewParams);
    });
  },
  editLedgerEntry(id){
    const entry = findById('ledger',id);
    if(!entry){ toast('Entry not found'); return; }
    if(entry.refType==='expense'){ return ExpensesUI.openForm(entry.refId); }
    if(entry.refType==='payment'){ return EventsUI.openPaymentEditForm(entry.refId); }
    if(entry.refType==='workerPayment'){ return EventsUI.openWorkerPayEditForm(entry.refId); }
    if(entry.refType==='partnerTx'){ const tx = findById('partnerTx',entry.refId); if(tx){ return FinanceUI.openPartnerTxEditForm(tx.id); } }
    if(entry.refType==='supplierPayment'){ const sp = findById('supplierPayments',entry.refId); if(sp){ return SupplierUI.openPayForm(sp.supplierId, entry.refId); } }
    toast('Edit is not available for this activity type');
  },
  deleteLedgerEntry(id){
    const entry = findById('ledger',id);
    if(!entry){ toast('Entry not found'); return; }
    confirmDialog('Delete activity entry?','This will remove the record and its ledger entry.', async ()=>{
      if(entry.refType==='expense'){ return ExpensesUI.remove(entry.refId); }
      if(entry.refType==='payment'){ const p = findById('payments',entry.refId); if(p){ return EventsUI.removePayment(entry.refId,p.eventId); } }
      if(entry.refType==='workerPayment'){ const wp = findById('workerPayments',entry.refId); if(wp){ return EventsUI.removeWorkerPayment(entry.refId, wp.eventId); } }
      if(entry.refType==='partnerTx'){ return FinanceUI.removePartnerTx(entry.refId); }
      if(entry.refType==='supplierPayment'){ const sp = findById('supplierPayments',entry.refId); if(sp){ return SupplierUI.removePayment(entry.refId, sp.supplierId); } }
      if(entry.refType==='transfer'){ await removeLedgerByRef('transfer', entry.refId); toast('Transfer removed'); Nav.go(App.view, App.viewParams); return; }
      await deleteRecord('ledger',id);
      toast('Activity deleted'); Nav.go(App.view, App.viewParams);
    }, 'Delete');
  }
};

const EXPENSE_CATEGORIES = ['Flowers','Workers','Fuel','Vehicle','Food','Printing','Marketing','Rent','Electricity','Decoration','Maintenance','Miscellaneous'];
const ExpensesUI = {
  query:'',
  fields(eventId){
    return [
      {key:'date',label:'Date',type:'date',default:Util.todayISO()},
      {key:'category',label:'Category',type:'select',options:EXPENSE_CATEGORIES,required:true},
      {key:'amount',label:'Amount',type:'number',required:true},
      {key:'wallet',label:'Wallet',type:'select',options:()=>walletOptions()},
      {key:'paidBy',label:'Paid By'},
      {key:'supplierId',label:'Supplier',type:'select',options:()=>[{value:'',label:'— None —'},...C('suppliers').map(s=>({value:s.id,label:s.name}))]},
      {key:'partnerId',label:'Partner (if partner paid)',type:'select',options:()=>[{value:'',label:'— None —'},...C('partners').map(p=>({value:p.id,label:p.name}))]},
      {key:'eventId',label:'Event',type:'select',options:()=>[{value:'',label:'— General Business —'},...C('events').map(e=>({value:e.id,label:e.title||'Untitled'}))],default:eventId||''},
      {key:'billPhoto',label:'Bill Photo',type:'image'},
      {key:'notes',label:'Notes',type:'textarea'},
    ];
  },
  openForm(id, eventId){
    const ex = id? findById('expenses',id) : null;
    const flds = this.fields(eventId);
    const fieldsHtml = flds.map(f=>renderField(f, ex? ex[f.key] : f.default)).join('');
    openSheet((ex?'Edit ':'Add ')+'Expense', `<div>${fieldsHtml}</div>
      <div class="form-actions">
        ${ex?`<button class="btn btn-danger" onclick="ExpensesUI.remove('${ex.id}')">Delete</button>`:''}
        <button class="btn btn-primary btn-block" onclick="ExpensesUI.save(${ex?`'${ex.id}'`:'null'})">Save Expense</button>
      </div>`);
  },
  async save(id){
    const flds = this.fields();
    if(!validateFields(flds)) return;
    const obj = id? {...findById('expenses',id)} : {};
    flds.forEach(f=>{ obj[f.key]=readFieldValue(f); });
    if(id){ await removeLedgerByRef('expense',id); await updateRecord('expenses',obj); }
    else { const created = await addRecord('expenses',obj); obj.id = created.id; }
    await addLedger({walletId:obj.wallet, dir:'out', amount:obj.amount, date:obj.date, category:'Expense: '+obj.category, refType:'expense', refId:obj.id, note:obj.notes||''});
    closeSheet(); toast('Expense saved');
    Nav.go(obj.eventId? 'eventDetail' : App.view, obj.eventId? {id:obj.eventId, tab:'expenses'} : App.viewParams);
  },
  remove(id){
    const ex = findById('expenses',id);
    confirmDialog('Delete expense?','This will remove the expense and its wallet entry.', async ()=>{
      await removeLedgerByRef('expense',id); await deleteRecord('expenses',id);
      closeSheet(); toast('Expense deleted');
      Nav.go(ex.eventId?'eventDetail':'expenses', ex.eventId?{id:ex.eventId,tab:'expenses'}:{});
    });
  },
  list(){
    let items = C('expenses');
    if(this.query){ const q=this.query.toLowerCase(); items = items.filter(e=>(e.category||'').toLowerCase().includes(q)||(e.notes||'').toLowerCase().includes(q)); }
    return Util.sortByDateDesc(items,'date');
  }
};

const SupplierUI = {
  openPayForm(supplierId, paymentId){
    const sp = paymentId ? findById('supplierPayments', paymentId) : null;
    openSheet(sp ? 'Edit Supplier Payment' : 'Pay Supplier', `
      <div class="field"><label>Amount *</label><input type="number" id="spAmount" value="${sp?Util.esc(sp.amount):''}"></div>
      <div class="field"><label>Date</label><input type="date" id="spDate" value="${sp?Util.esc(sp.date):Util.todayISO()}"></div>
      <div class="field"><label>Wallet</label><select id="spWallet">${walletOptions().map(w=>`<option value="${w.value}" ${sp&&sp.wallet===w.value?'selected':''}>${w.label}</option>`).join('')}</select></div>
      <div class="field"><label>Note</label><input id="spNote" value="${sp?Util.esc(sp.note||''):''}"></div>
      <button class="btn btn-primary btn-block" onclick="SupplierUI.${sp?'savePayEdit':'savePay'}('${supplierId}'${sp?`, '${paymentId}'`:''})">${sp?'Update':'Save'}</button>`);
  },
  async savePay(supplierId){
    const amount=Number(document.getElementById('spAmount').value)||0; if(amount<=0){ toast('Enter a valid amount'); return; }
    const walletId=document.getElementById('spWallet').value, date=document.getElementById('spDate').value;
    const rec=await addRecord('supplierPayments',{supplierId,amount,date,wallet:walletId,note:document.getElementById('spNote').value});
    await addLedger({walletId,dir:'out',amount,date,category:'Supplier Payment',refType:'supplierPayment',refId:rec.id,note:''});
    closeSheet(); toast('Payment recorded'); Nav.go('supplierProfile',{id:supplierId});
  },
  async savePayEdit(supplierId, paymentId){
    const sp = findById('supplierPayments', paymentId);
    if(!sp){ toast('Payment not found'); return; }
    const amount=Number(document.getElementById('spAmount').value)||0; if(amount<=0){ toast('Enter a valid amount'); return; }
    const walletId=document.getElementById('spWallet').value, date=document.getElementById('spDate').value;
    const updated = {...sp, amount, date, wallet:walletId, note:document.getElementById('spNote').value};
    await updateRecord('supplierPayments', updated);
    await removeLedgerByRef('supplierPayment', paymentId);
    await addLedger({walletId,dir:'out',amount,date,category:'Supplier Payment',refType:'supplierPayment',refId:paymentId,note:''});
    closeSheet(); toast('Payment updated'); Nav.go('supplierProfile',{id:supplierId});
  },
  async removePayment(paymentId, supplierId){
    confirmDialog('Delete supplier payment?','This will remove the payment and its wallet entry.', async ()=>{
      await removeLedgerByRef('supplierPayment', paymentId); await deleteRecord('supplierPayments', paymentId);
      toast('Supplier payment deleted'); Nav.go('supplierProfile',{id:supplierId});
    });
  }
};

/* ============================================================
   REPORTS
   ============================================================ */
const ReportsUI = {
  range:'month', from:'', to:'',
  bounds(){
    const now=new Date();
    if(this.range==='day') return [new Date(now.toDateString()).getTime(), now.getTime()];
    if(this.range==='week'){ const d=new Date(now); d.setDate(d.getDate()-7); return [d.getTime(), now.getTime()]; }
    if(this.range==='month'){ const d=new Date(now.getFullYear(),now.getMonth(),1); return [d.getTime(), now.getTime()]; }
    if(this.range==='year'){ const d=new Date(now.getFullYear(),0,1); return [d.getTime(), now.getTime()]; }
    if(this.range==='custom' && this.from && this.to) return [Util.toTS(this.from), Util.toTS(this.to)+86399999];
    return [0, now.getTime()];
  },
  inRange(ts){ const [a,b]=this.bounds(); return ts>=a && ts<=b; }
};
Views.reports = function(){
  const [from,to] = ReportsUI.bounds();
  const pays = C('payments').filter(p=>ReportsUI.inRange(Util.toTS(p.date)));
  const exps = C('expenses').filter(e=>ReportsUI.inRange(Util.toTS(e.date)));
  const wPays = C('workerPayments').filter(p=>ReportsUI.inRange(Util.toTS(p.date)));
  const revenue = pays.reduce((s,p)=>s+p.amount,0);
  const expenseTotal = exps.reduce((s,e)=>s+e.amount,0) + wPays.reduce((s,p)=>s+p.amount,0);
  const grossProfit = revenue - expenseTotal;
  const inv = C('partnerTx').filter(t=>t.type==='investment' && ReportsUI.inRange(Util.toTS(t.date))).reduce((s,t)=>s+t.amount,0);
  const wd = C('partnerTx').filter(t=>t.type==='withdrawal' && ReportsUI.inRange(Util.toTS(t.date))).reduce((s,t)=>s+t.amount,0);
  const netProfit = C('events').filter(e=>e.eventDate && ReportsUI.inRange(Util.toTS(e.eventDate))).reduce((s,e)=>s+eventProfit(e),0);
  const pending = C('events').reduce((s,e)=>s+Math.max(0,(Number(e.contractAmount)||0)-eventReceived(e.id)),0);
  const byCategory = {};
  exps.forEach(e=>{ byCategory[e.category]=(byCategory[e.category]||0)+e.amount; });
  const eventProfitRows = Util.sortByDateDesc(C('events'),'eventDate').slice(0,15);

  return `
    <div class="view-title no-print">Reports</div>
    <div class="view-sub no-print">Revenue, profit, cash flow &amp; more</div>
    <div class="tabs no-print">${['day','week','month','year','custom'].map(r=>`<div class="tab ${ReportsUI.range===r?'active':''}" onclick="ReportsUI.range='${r}'; Nav.go('reports');">${r[0].toUpperCase()+r.slice(1)}</div>`).join('')}</div>
    ${ReportsUI.range==='custom'?`<div class="field-row no-print"><div class="field"><label>From</label><input type="date" value="${ReportsUI.from}" onchange="ReportsUI.from=this.value; Nav.go('reports');"></div><div class="field"><label>To</label><input type="date" value="${ReportsUI.to}" onchange="ReportsUI.to=this.value; Nav.go('reports');"></div></div>`:''}

    <div class="stat-grid">
      <div class="stat-card ok"><div class="v">${Util.money(revenue)}</div><div class="l">Revenue</div></div>
      <div class="stat-card warn"><div class="v">${Util.money(expenseTotal)}</div><div class="l">Expense</div></div>
      <div class="stat-card ${grossProfit>=0?'ok':'danger'}"><div class="v">${Util.money(grossProfit)}</div><div class="l">Gross Profit</div></div>
      <div class="stat-card"><div class="v">${Util.money(netProfit)}</div><div class="l">Net Profit</div></div>
      <div class="stat-card"><div class="v">${Util.money(inv)}</div><div class="l">Partner Investment</div></div>
      <div class="stat-card"><div class="v">${Util.money(wd)}</div><div class="l">Partner Withdrawals</div></div>
      <div class="stat-card"><div class="v">${Util.money(totalCash())}</div><div class="l">Current Cash</div></div>
      <div class="stat-card ${pending>0?'warn':'ok'}"><div class="v">${Util.money(pending)}</div><div class="l">Pending Collections</div></div>
    </div>

    <div class="section-label">Expense by Category</div>
    <div class="card">${Object.keys(byCategory).length? Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;"><span>${Util.esc(cat)}</span><span class="num">${Util.money(amt)}</span></div>`).join('') : `<div class="muted" style="font-size:13px;">No expenses in this range</div>`}</div>

    <div class="section-label">Expense Report</div>
    <div class="card">${exps.length? exps.slice(0,12).map(e=>{
      const supplier = findById('suppliers', e.supplierId) || {};
      return `<div class="list-row" style="align-items:flex-start;">
        <div class="avatar">🧾</div>
        <div class="row-main"><div class="row-title">${Util.esc(e.category)}</div><div class="row-sub">${Util.esc(e.notes || supplier.name || 'General Business')} · ${Util.dateShort(Util.toTS(e.date))}</div></div>
        <div class="row-end" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div class="row-amt">${Util.money(e.amount)}</div>
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); ExpensesUI.openForm('${e.id}')">Edit</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty" style="padding:20px;"><div class="empty-sub">No expenses in this range</div></div>`}</div>
    <div class="form-actions no-print"><button class="btn btn-primary btn-block" onclick="Nav.go('expenses')">View all expenses</button></div>

    <div class="section-label">Event-wise Profit</div>
    ${eventProfitRows.length? eventProfitRows.map(e=>{ const pr=eventProfit(e);
      return `<div class="list-row" onclick="Nav.go('eventDetail',{id:'${e.id}'})"><div class="avatar">🎉</div>
      <div class="row-main"><div class="row-title">${Util.esc(e.title||'Untitled')}</div><div class="row-sub">${Util.dateShort(Util.toTS(e.eventDate))}</div></div>
      <div class="row-end"><div class="row-amt ${pr>=0?'text-ok':'text-danger'}">${Util.money(pr)}</div></div></div>`; }).join('') : `<div class="empty" style="padding:20px;"><div class="empty-sub">No events yet</div></div>`}

    <div class="section-label no-print">Export</div>
    <div class="card no-print" style="display:flex;gap:10px;">
      <button class="btn btn-ghost btn-block" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
  `;
};

const BackupUI = {
  async exportJSON(){
    const payload = { app:'BlossomEventsERP', version:DB_VERSION, exportedAt:Date.now(), settings:App.settings, data:{} };
    for(const s of STORES){ if(s!=='settings') payload.data[s]=C(s); }
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`blossom-backup-${Util.todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
  },
  triggerRestore(){ document.getElementById('restoreFileInput').click(); },
  handleRestoreFile(e){
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const payload = JSON.parse(reader.result);
        if(!payload.data){ toast('Invalid backup file'); return; }
        confirmDialog('Restore backup?','This will overwrite ALL current data on this device with the backup contents. This cannot be undone.', async ()=>{
          for(const s of STORES){
            if(s==='settings') continue;
            await dbClear(s);
            App.cache[s]=[];
            for(const item of (payload.data[s]||[])){ await dbPut(s,item); App.cache[s].push(item); }
          }
          if(payload.settings){ App.settings=payload.settings; await dbPut('settings',App.settings); }
          toast('Backup restored'); applyBranding(); applyTheme(App.settings.theme||'light'); Nav.go('dashboard');
        }, 'Restore & Overwrite');
      }catch(err){ toast('Could not read backup file'); }
    };
    reader.readAsText(file);
  }
};
Views.backup = function(){
  const totalRecords = STORES.filter(s=>s!=='settings').reduce((s,st)=>s+C(st).length,0);
  return `<div class="view-title">Backup &amp; Restore</div><div class="view-sub">${totalRecords} records on this device</div>
    <div class="card">
      <div class="row-title" style="margin-bottom:6px;">Export Backup</div>
      <div class="muted" style="font-size:13px;margin-bottom:12px;">Save a full JSON backup of settings, partners, customers, events, finance, resources, workers, suppliers and expenses.</div>
      <button class="btn btn-primary btn-block" onclick="BackupUI.exportJSON()">⬇️ Download Backup (.json)</button>
    </div>
    <div class="card">
      <div class="row-title" style="margin-bottom:6px;">Restore Backup</div>
      <div class="muted" style="font-size:13px;margin-bottom:12px;">Restoring will overwrite all data currently on this device. Make sure you have a current backup first.</div>
      <input type="file" accept="application/json" id="restoreFileInput" style="display:none;" onchange="BackupUI.handleRestoreFile(event)">
      <button class="btn btn-ghost btn-block" onclick="BackupUI.triggerRestore()">⬆️ Choose Backup File</button>
    </div>`;
};
